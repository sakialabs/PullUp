[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pullup-api"
version = "0.1.0"
description = "Production-shaped FastAPI spine for PullUp"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.16.5,<2",
  "fastapi>=0.116.1,<1",
  "psycopg[binary]>=3.2.10,<4",
  "pydantic>=2.11.7,<3",
  "sqlalchemy>=2.0.43,<3",
  "uvicorn[standard]>=0.35.0,<1",
]

[project.scripts]
pullup-seed = "pullup_api.seed:main"
pullup-worker = "pullup_api.worker:main"

[dependency-groups]
dev = [
  "pytest>=8.4.1,<10",
  "ruff>=0.12.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["pullup_api"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
